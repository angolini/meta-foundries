name: kas lock update

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Simulated result of the builds
        type: choice
        options: [fail, pass]
        default: fail
      fake_kas:
        description: kas tag to treat as the newest release (empty = real)
        default: '5.4'

permissions: {}

env:
  KAS_CLONE_DEPTH: 1
  # kas 5.5, the image the script below is taken from.
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:4b210b0be3c887875973c4f4c35470b4ecf3edd2346c9de1bdd33feae5b86e94
  CACHE_DIR: /efs/foundries

jobs:
  relock:
    runs-on: ubuntu-latest
    name: relock against master
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.relock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          cid=$(docker create "$KAS_CONTAINER_IMAGE")
          docker cp "$cid:/usr/local/bin/kas-container" "$KAS_CONTAINER"
          docker rm "$cid"
          chmod +x "$KAS_CONTAINER"
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" "$KAS_CONTAINER" ||
            echo "::notice::kas ${LATEST} is released; move KAS_CONTAINER_IMAGE to its digest."

      - name: Look for a newer kas release
        id: kas
        env:
          FAKE_KAS: ${{ inputs.fake_kas }}
        run: |
          latest=${FAKE_KAS:-}
          [ -n "$latest" ] || latest=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          pinned=$(sed -n 's/^KAS_CONTAINER_SCRIPT_VERSION="\(.*\)"/\1/p' "$KAS_CONTAINER")
          if [ "$latest" = "$pinned" ]; then
            echo "kas $pinned is the newest release."
            exit 0
          fi
          digest=$(python3 - "$latest" <<'PY'
          import json, sys, urllib.request

          repo, tag = "siemens/kas/kas", sys.argv[1]
          token = json.load(urllib.request.urlopen(
              f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io"))["token"]
          req = urllib.request.Request(
              f"https://ghcr.io/v2/{repo}/manifests/{tag}", method="HEAD",
              headers={"Authorization": f"Bearer {token}",
                       "Accept": "application/vnd.oci.image.index.v1+json"})
          print(urllib.request.urlopen(req).headers["Docker-Content-Digest"])
          PY
          )
          {
            echo "latest=$latest"
            echo "pinned=$pinned"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      # A workflow cannot move the pin itself: GITHUB_TOKEN may not push
      # changes under .github/workflows.
      - name: File an issue when kas has a newer release
        if: steps.kas.outputs.latest != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LATEST: ${{ steps.kas.outputs.latest }}
          PINNED: ${{ steps.kas.outputs.pinned }}
          DIGEST: ${{ steps.kas.outputs.digest }}
        with:
          script: |
            const { LATEST, PINNED, DIGEST } = process.env;
            const title = `ci: move KAS_CONTAINER_IMAGE to kas ${LATEST}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            });
            if (issues.some((i) => !i.pull_request && i.title === title)) {
              core.info(`Issue for kas ${LATEST} already filed.`);
              return;
            }
            await github.rest.issues.create({
              ...context.repo,
              title,
              assignees: ['angolini'],
              body: `The workflows pin kas ${PINNED}. kas ${LATEST} is out.

            \`\`\`
            KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@${DIGEST}
            \`\`\`

            It is set in .github/workflows/kas-build.yml, yocto-check-layer.yml
            and kas-lock-update.yml. A workflow cannot change it, because
            GITHUB_TOKEN may not push under .github/workflows.`,
            });

      - name: Resolve every target against upstream master
        id: relock
        run: |
          # --update ignores the lockfiles, so every repo lands on its tip.
          echo "# lock update test run $GITHUB_RUN_ID" >> ci/include/base.lock.yml
          if git diff --quiet -- 'ci/*.lock.yml' 'ci/include/*.lock.yml'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo 'Upstream master matches the committed pins.' >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            {
              echo '## Pins this run would promote'
              echo '```diff'
              git --no-pager diff -- 'ci/*.lock.yml' 'ci/include/*.lock.yml'
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload the candidate lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kas-locks-candidate
          path: |
            ci/*.lock.yml
            ci/include/*.lock.yml

      - name: Upload kas-container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kas-container-lock-update
          path: ${{ env.KAS_CONTAINER }}

  build:
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - qemuarm64-secureboot
          - qemux86-64
          - uno-q
    name: build ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - name: Simulated build
        env:
          OUTCOME: ${{ inputs.outcome }}
        run: '[ "$OUTCOME" = pass ]'

  check-layer:
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    name: yocto-check-layer
    permissions:
      contents: read
    steps:
      - name: Simulated yocto-check-layer
        run: 'true'

  propose:
    needs: [relock, build, check-layer]
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    name: propose the lock update
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job pushes a branch, so it keeps the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      # The download must not leave the committed pins in place.
      - name: Drop the committed lockfiles
        run: rm -f ci/*.lock.yml ci/include/*.lock.yml

      - name: Download the candidate lockfiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kas-locks-candidate
          path: ci

      - name: Push the lock update branch
        id: push
        continue-on-error: true
        run: |
          branch="ci-lock-update-$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -A -- 'ci/*.lock.yml' 'ci/include/*.lock.yml'
          git commit --file - <<EOF
          ci: update the kas lockfiles to upstream master

          The weekly lock update resolved every kas target against the tip
          of the branches the layers track. All three machine builds and
          yocto-check-layer passed at these revisions, so they are safe to
          adopt as the pins every pull request builds with.

          Produced by the kas lock update run ${GITHUB_RUN_ID}.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the lock update pull request
        id: pr
        if: steps.push.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { BRANCH, RUN_URL } = process.env;
            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              base: 'main',
              head: BRANCH,
              title: 'ci: update the kas lockfiles to upstream master',
              body: `Weekly lock update. Every kas target was resolved against upstream master, then built: the three machines and \`yocto-check-layer\` all passed at these revisions.

            Produced by [run ${context.runId}](${RUN_URL}).`,
            });
            await github.rest.issues.addAssignees({
              ...context.repo, issue_number: pr.number, assignees: ['angolini'],
            });

      - name: Report a pull request that could not be opened
        if: steps.push.outcome == 'failure' || steps.pr.outcome == 'failure'
        run: |
          {
            echo '## The lock update has no pull request'
            echo
            echo 'The builds passed but this job could not push a branch or'
            echo 'open a pull request, most likely because the workflow token'
            echo 'is not allowed to write here. Download the'
            echo '`kas-locks-candidate` artifact and commit it by hand.'
          } >> $GITHUB_STEP_SUMMARY
          exit 1

  report-failure:
    needs: [relock, build, check-layer]
    if: failure()
    runs-on: ubuntu-latest
    name: report the breakage
    permissions:
      issues: write
    steps:
      # The runners carry no gh CLI; github-script talks to the API directly.
      - name: Open or update the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: 'Upstream master broke the weekly kas lock update'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { TITLE, RUN_URL } = process.env;
            const body = `The weekly run against upstream master failed, so the pins in
            the tree stay where they are and pull requests are unaffected.

            Failing run: ${RUN_URL}

            The candidate lockfiles are attached to that run as the
            \`kas-locks-candidate\` artifact, which names the revisions that
            broke.`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const issue = open.find((i) => !i.pull_request && i.title === TITLE);
            if (issue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: TITLE, body, assignees: ['angolini'],
              });
            }
