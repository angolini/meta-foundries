header:
  version: 14
  includes:
    - ci/include/base.yml

machine: uno-q

repos:
  meta-qcom-3rdparty:
    url: https://github.com/qualcomm-linux/meta-qcom-3rdparty
    path: meta-qcom-3rdparty
    branch: main
    layers:
      .:

local_conf_header:
  dev-adbd: |
    # adb reaches the console on boards with no bughopper attached.
    IMAGE_CLASSES += "image-adbd"
    EXTRA_IMAGE_FEATURES += "enable-adbd"
  esp-cluster-size: |
    EXTRA_IMAGECMD:append:ota-esp = " -s 8"
