header:
  version: 14
  includes:
    - ci/include/base.yml
    - ci/include/nodistro.yml

machine: qemuarm64-secureboot

repos:
  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: meta-arm
    branch: wrynose
    layers:
      meta-arm:
      meta-arm-bsp:
      meta-arm-toolchain:

local_conf_header:
  sota-boot: |
    OSTREE_BOOTLOADER = "grub"
    EFI_PROVIDER = "grub-efi"
    WKS_FILE:sota = "efiimage-sota.wks.in"
    IMAGE_BOOT_FILES:sota = ""
    OSTREE_KERNEL_ARGS = "console=ttyAMA0,115200 ${OSTREE_KERNEL_ARGS_COMMON}"

  rootfs-space: |
    IMAGE_ROOTFS_EXTRA_SPACE = "1048576"
