header:
  version: 14
  includes:
    - ci/include/distro.yml

target: core-image-full-cmdline

repos:
  meta-foundries:
    layers:
      .:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: master
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: master
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: master
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  meta-updater:
    url: https://github.com/uptane/meta-updater
    branch: master
    layers:
      .:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    # Add size metadata to OSTree commit objects, allowing update size estimation
    EXTRA_OSTREE_COMMIT += "--generate-sizes"

  packagegroup-foundries-platform: |
    IMAGE_INSTALL:append = " packagegroup-foundries-platform"
    IMAGE_INSTALL:remove = "aktualizr aktualizr-info aktualizr-shared-prov"

  packagegroup-foundries-containers: |
    IMAGE_INSTALL:append = " packagegroup-foundries-containers"

  fio-device-register: |
    LMP_FACTORY ?= "default"
    LMP_FACTORY_TAG ?= "master"
    OS_RELEASE_FIELDS:append = " LMP_FACTORY LMP_FACTORY_TAG"
