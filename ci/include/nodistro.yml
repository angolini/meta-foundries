header:
  version: 14

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  meta-updater:
    url: https://github.com/uptane/meta-updater
    branch: wrynose
    layers:
      .:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose
    layers:
      .:

distro: nodistro
target: core-image-full-cmdline

local_conf_header:
  nodistro-sota: |
    require conf/distro/sota.conf.inc
    INITRAMFS_IMAGE = "initramfs-ostree-image"
    DISTRO_FEATURES_OPTED_OUT += "ptest"

  nodistro-baseline: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " virtualization"
